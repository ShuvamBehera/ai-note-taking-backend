<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Performance Optimization: Essential meta tags first -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Performance Optimization: Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Performance Optimization: DNS prefetch for API domains -->
  <link rel="dns-prefetch" href="//openrouter.ai">
  <link rel="dns-prefetch" href="//api.runwayml.com">
  
  <!-- Performance Optimization: Critical CSS inlined -->
  <style>
    /* Critical loading styles */
    #root {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9fafb;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      #root {
        background-color: #111827;
        color: #f9fafb;
      }
    }
  </style>
  
  <!-- SEO and Meta -->
  <title>AutoCreator AI - AI-Powered Content Creation Platform</title>
  <meta name="description" content="Create engaging content with AI-powered script generation, voice synthesis, video creation, and automated scheduling." />
  <meta name="keywords" content="AI, content creation, script generation, voice synthesis, video creation, automation" />
  <meta name="author" content="AutoCreator AI" />
  
  <!-- Performance Optimization: Resource hints -->
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  
  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#000000" />
  <meta name="msapplication-TileColor" content="#000000" />
  
  <!-- Performance Optimization: Reduce CLS with font-display -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Performance Optimization: Initial loading state to prevent CLS -->
  <div id="root">
    <div style="text-align: center;">
      <div class="loading-spinner"></div>
      <p style="margin-top: 1rem; color: #6b7280;">Loading AutoCreator AI...</p>
    </div>
  </div>
  
  <!-- Performance Optimization: Script loading optimized -->
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Performance Optimization: Service worker registration -->
  <script>
    // Register service worker for caching
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
    
    // Performance Optimization: Critical resource loading
    window.addEventListener('DOMContentLoaded', () => {
      // Preload critical images
      const criticalImages = [
        '/images/logo.svg',
        '/images/hero-bg.jpg'
      ];
      
      criticalImages.forEach(src => {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = src;
        document.head.appendChild(link);
      });
    });
  </script>
</body>
</html>
